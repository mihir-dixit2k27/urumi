apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
  labels:
    app: mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server
  template:
    metadata:
      labels:
        app: mcp-server
    spec:
      containers:
      - name: mcp-server
        image: mcpkube-mcp-server:latest # Intended to be built locally or replaced by registry image
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "3000"
        - name: ALLOWED_ORIGIN
          value: "http://gateway-service" # Strict Origin validation
        - name: WOOCOMMERCE_URL
          value: "http://wordpress-service:80"
        - name: WOOCOMMERCE_KEY
          valueFrom:
            secretKeyRef:
              name: woocommerce-credentials
              key: woocommerce-consumer-key
        - name: WOOCOMMERCE_SECRET
          valueFrom:
            secretKeyRef:
              name: woocommerce-credentials
              key: woocommerce-consumer-secret
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: 250m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-server
spec:
  selector:
    app: mcp-server
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: mcpkube-gateway:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: PORT
          value: "4000"
        ports:
        - containerPort: 4000
        resources:
          limits:
            cpu: 300m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  selector:
    app: gateway
  ports:
  - port: 80
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
      - name: dashboard
        image: mcpkube-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-service
spec:
  selector:
    app: dashboard
  ports:
  - port: 80
    targetPort: 80

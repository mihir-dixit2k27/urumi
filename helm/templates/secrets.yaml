apiVersion: v1
kind: Secret
metadata:
  name: woocommerce-credentials
  labels:
    app: woocommerce
type: Opaque
stringData:
  mariadb-root-password: {{ .Values.mariadb.rootPassword | quote }}
  mariadb-password: {{ .Values.mariadb.dbPassword | quote }}
  wordpress-password: {{ .Values.wordpress.password | quote }}
  # WooCommerce consumer key and secret (configured manually or via provisioning later)
  woocommerce-consumer-key: "wc_api_placeholder_key"
  woocommerce-consumer-secret: "wc_api_placeholder_secret"
